<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#0F172A" />
  <g id="header" data-pptx-bounds="20,40,437,54">
    <rect x="48" y="48" width="6" height="36" rx="3" fill="#38BDF8" />
    <text x="68" y="80" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#E2E8F0">优先级调度与并发控制</text>
  </g>
  <g id="weighted-scheduler" data-pptx-bounds="4,93,667,323">
    <text x="48" y="130" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">WeightedScheduler 加权轮转</text>
    <rect x="48" y="145" width="580" height="250" rx="8" fill="#1E293B" />
    <text x="80" y="180" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">配置示例：</text>
    <rect x="80" y="195" width="160" height="30" rx="4" fill="#38BDF8" opacity="0.15" />
    <text x="160" y="215" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8" text-anchor="middle">pri:2  w:5</text>
    <rect x="260" y="195" width="160" height="30" rx="4" fill="#F97316" opacity="0.15" />
    <text x="340" y="215" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#F97316" text-anchor="middle">pri:1  w:3</text>
    <rect x="440" y="195" width="160" height="30" rx="4" fill="#94A3B8" opacity="0.15" />
    <text x="520" y="215" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#94A3B8" text-anchor="middle">pri:0  w:2</text>
    <text x="80" y="260" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#E2E8F0">每 10 次消费中：高 5 次 / 中 3 次 / 低 2 次</text>
    <rect x="80" y="280" width="520" height="2" fill="#334155" />
    <text x="80" y="310" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#F97316">防饥饿机制</text>
    <text x="80" y="340" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">配额耗尽 → 重置 → 每轮至少消费 1 次</text>
    <text x="80" y="365" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">高优先级队列为空 → 低优先级立即有机会（降序兜底）</text>
  </g>
  <g id="concurrent-control" data-pptx-bounds="617,93,658,323">
    <text x="660" y="130" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#F97316">用户并发控制</text>
    <rect x="660" y="145" width="572" height="250" rx="8" fill="#1E293B" />
    <text x="690" y="178" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#38BDF8">ConcurrentManager</text>
    <text x="690" y="210" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#E2E8F0">两个维度：taskMap（任务）+ userMap（用户）</text>
    <rect x="690" y="225" width="520" height="2" fill="#334155" />
    <text x="690" y="255" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">CAS 原子操作</text>
    <text x="690" y="285" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">CompareAndSwap — 乐观、无阻塞</text>
    <text x="690" y="310" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">低竞争场景比 Mutex 性能更好</text>
    <rect x="690" y="325" width="520" height="2" fill="#334155" />
    <text x="690" y="355" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#F97316">etcd Watch 驱动同步</text>
    <text x="690" y="380" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">新任务 → Watch Put → 所有 Pod +1</text>
  </g>
  <g id="etcd-watch-diagram" data-pptx-bounds="0,414,1280,253">
    <rect x="48" y="430" width="1184" height="220" rx="8" fill="#1E293B" />
    <text x="80" y="465" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#A78BFA">多 Pod 一致性</text>
    <rect x="120" y="490" width="160" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="200" y="520" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">Pod 1</text>
    <rect x="340" y="490" width="160" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="420" y="520" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">Pod 2</text>
    <rect x="560" y="490" width="160" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="640" y="520" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">Pod 3</text>
    <rect x="850" y="490" width="300" height="50" rx="6" fill="#0F172A" stroke="#F97316" stroke-width="1" />
    <text x="1000" y="520" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#F97316" text-anchor="middle">etcd /task/{env}/</text>
    <line x1="280" y1="540" x2="850" y2="515" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="500" y1="540" x2="850" y2="515" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="720" y1="540" x2="850" y2="515" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <text x="640" y="570" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">所有 Pod Watch 同一前缀 → 任意 Pod 写 etcd → 所有 Pod 收到事件</text>
    <text x="640" y="600" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">最终一致：毫秒级延迟，对实际场景可接受</text>
  </g>
  <g id="page-number" data-pptx-bounds="1216,676,23,23">
    <text x="1232" y="692" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569" text-anchor="end">09</text>
  </g>
</svg>