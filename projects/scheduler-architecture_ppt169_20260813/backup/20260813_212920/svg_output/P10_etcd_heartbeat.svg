<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect width="1280" height="720" fill="#0F172A" />
  <g id="header" data-pptx-bounds="12,40,551,54">
    <rect x="48" y="48" width="6" height="36" rx="3" fill="#38BDF8" />
    <text x="68" y="80" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#E2E8F0">etcd 注册、心跳与故障检测</text>
  </g>
  <g id="etcd-capabilities" data-pptx-bounds="0,104,1280,151">
    <text x="48" y="130" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">etcd 四大核心能力</text>
    <rect x="48" y="145" width="280" height="100" rx="8" fill="#1E293B" />
    <text x="188" y="178" font-family="Fira Code, SF Mono, monospace" font-size="15" fill="#38BDF8" text-anchor="middle">Put / Get / Delete</text>
    <text x="188" y="205" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">基本读写删</text>
    <rect x="348" y="145" width="280" height="100" rx="8" fill="#1E293B" />
    <text x="488" y="178" font-family="Fira Code, SF Mono, monospace" font-size="15" fill="#F97316" text-anchor="middle">Watch</text>
    <text x="488" y="205" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">监听变化，实时推送</text>
    <rect x="648" y="145" width="280" height="100" rx="8" fill="#1E293B" />
    <text x="788" y="178" font-family="Fira Code, SF Mono, monospace" font-size="15" fill="#A78BFA" text-anchor="middle">Lease</text>
    <text x="788" y="205" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">TTL 自动过期清理</text>
    <rect x="948" y="145" width="284" height="100" rx="8" fill="#1E293B" />
    <text x="1090" y="178" font-family="Fira Code, SF Mono, monospace" font-size="15" fill="#22C55E" text-anchor="middle">Txn</text>
    <text x="1090" y="205" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">乐观锁事务</text>
  </g>
  <g id="key-format" data-pptx-bounds="4,266,667,128">
    <text x="48" y="290" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#F97316">Key 格式</text>
    <rect x="48" y="305" width="580" height="80" rx="8" fill="#1E293B" />
    <text x="80" y="335" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#38BDF8">/worker/{env}/{podName}</text>
    <text x="380" y="335" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">Worker 注册</text>
    <text x="80" y="365" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#F97316">/task/{env}/{taskID}</text>
    <text x="380" y="365" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">Task 运行注册</text>
  </g>
  <g id="heartbeat" data-pptx-bounds="617,266,658,128">
    <text x="660" y="290" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#A78BFA">心跳机制</text>
    <rect x="660" y="305" width="572" height="80" rx="8" fill="#1E293B" />
    <text x="690" y="335" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#E2E8F0">Sidecar 每 30s 心跳 → Scheduler UpdateWorker</text>
    <text x="690" y="365" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">Txn 乐观锁写回 + 绑定最新 Lease</text>
  </g>
  <g id="failure-detection" data-pptx-bounds="0,408,1280,174">
    <text x="48" y="435" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#EF4444">故障检测链路</text>
    <rect x="48" y="450" width="1184" height="120" rx="8" fill="#1E293B" />
    <rect x="90" y="490" width="140" height="40" rx="6" fill="#EF4444" opacity="0.15" stroke="#EF4444" stroke-width="1" />
    <text x="160" y="515" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#EF4444" text-anchor="middle">Worker 崩溃</text>
    <line x1="230" y1="510" x2="280" y2="510" stroke="#475569" stroke-width="1.5" />
    <polygon points="278,505 286,510 278,515" fill="#475569" />
    <rect x="288" y="490" width="140" height="40" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <text x="358" y="515" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">心跳停止</text>
    <line x1="428" y1="510" x2="478" y2="510" stroke="#475569" stroke-width="1.5" />
    <polygon points="476,505 484,510 476,515" fill="#475569" />
    <rect x="486" y="490" width="140" height="40" rx="6" fill="#A78BFA" opacity="0.15" stroke="#A78BFA" stroke-width="1" />
    <text x="556" y="515" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#A78BFA" text-anchor="middle">Lease 过期</text>
    <line x1="626" y1="510" x2="676" y2="510" stroke="#475569" stroke-width="1.5" />
    <polygon points="674,505 682,510 674,515" fill="#475569" />
    <rect x="684" y="490" width="170" height="40" rx="6" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="1" />
    <text x="769" y="515" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#F97316" text-anchor="middle">Watch Delete 事件</text>
    <line x1="854" y1="510" x2="904" y2="510" stroke="#475569" stroke-width="1.5" />
    <polygon points="902,505 910,510 902,515" fill="#475569" />
    <rect x="912" y="490" width="280" height="40" rx="6" fill="#22C55E" opacity="0.15" stroke="#22C55E" stroke-width="1" />
    <text x="1052" y="515" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="13" fill="#22C55E" text-anchor="middle">清理缓存 + 并发计数恢复</text>
  </g>
  <g id="design-choices" data-pptx-bounds="0,595,1280,80">
    <rect x="48" y="600" width="1184" height="70" rx="8" fill="#1E293B" />
    <text x="80" y="630" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">设计选择</text>
    <text x="200" y="630" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#E2E8F0">Grant（每 300s 重新创建 Lease）而非 KeepAlive</text>
    <text x="200" y="655" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8">TTL = 7200s，远大于 Grant 间隔，防止误删 key</text>
  </g>
  <g id="page-number" data-pptx-bounds="1216,676,23,23">
    <text x="1232" y="692" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569" text-anchor="end">10</text>
  </g>
