    <text x="80" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#38BDF8">BeforeProduce</text>
    <text x="226" y="475" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">→</text>
    <text x="246" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#F97316">Produce</text>
    <text x="340" y="475" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">→</text>
    <text x="360" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#38BDF8">Consume</text>
    <text x="460" y="475" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">→</text>
    <text x="480" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#F97316">BeforeCall</text>
    <text x="598" y="475" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">→</text>
    <text x="618" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#38BDF8">GenerateTask</text>
    <text x="758" y="475" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">→</text>
    <text x="778" y="475" font-family="Fira Code, SF Mono, monospace" font-size="14" fill="#F97316">AfterCall</text>
  </g>
  <g id="interfaces" data-pptx-bounds="0,519,1280,151">
    <text x="48" y="545" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">可选接口（Go 类型断言）</text>
    <rect x="48" y="560" width="1184" height="100" rx="8" fill="#1E293B" />
    <text x="80" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">RequestMapper</text>
    <text x="80" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">参数映射</text>
    <text x="240" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">MsgProducer</text>
    <text x="240" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">入队</text>
    <text x="390" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">MsgConsumer</text>
    <text x="390" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">出队</text>
    <text x="540" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">Generator</text>
    <text x="540" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">生成 JobData</text>
    <text x="690" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">CallResponseMapper</text>
    <text x="690" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">结果映射</text>
    <text x="890" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">Progressor</text>
    <text x="890" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">进度读写</text>
    <text x="1040" y="590" font-family="Fira Code, SF Mono, monospace" font-size="13" fill="#38BDF8">Caller</text>
    <text x="1040" y="615" font-family="Noto Sans SC, Inter, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8">直接调用</text>
  </g>
  <g id="page-number" data-pptx-bounds="1216,676,23,23">
